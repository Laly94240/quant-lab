# Research question: do simple trend / momentum rules on a diversified ETF basket add
# risk-adjusted value over the passive basket, after realistic costs and out of sample?
research_id: etf_gtaa_daily_v1

# RESEARCH PROXIES: US-listed ETFs (deep, clean daily history). Retail investors resident in the
# EU generally cannot BUY US-listed ETFs (PRIIPs/KID rule), so for execution each line must be
# mapped to a UCITS equivalent and its history re-tested (see docs/DECISIONS.md).
universe: [SPY, EFA, EEM, IEF, TLT, GLD, DBC, VNQ]

data:
  provider: csv          # run `quantlab fetch` once to snapshot Yahoo data into raw_dir
  raw_dir: data/raw
  start: "2007-01-01"    # DBC (2006) is the shortest history; common start is computed
  end: null

# One-way costs in bps of traded notional. ASSUMPTIONS to calibrate against broker statements.
costs: {commission_bps: 2.0, spread_bps: 3.0, slippage_bps: 2.0}

backtest:
  execution_delay: 1     # trade at the NEXT close after the signal (conservative)
  cash_rate: 0.0
  rf_annual: 0.0

risk:
  max_position_weight: 0.35
  max_gross_exposure: 1.0
  allow_short: false

walk_forward: {train_years: 5, test_years: 1, anchored: true}

benchmark: {name: equal_weight_bh, params: {rebalance: M}}

# Pre-registered gates: decide them BEFORE looking at results, do not tune them afterwards.
gates:
  min_oos_years: 5.0
  min_oos_sharpe: 0.4
  min_dsr: 0.95
  max_drawdown: 0.35
  min_psr_vs_benchmark: 0.95
  min_cost_stress_sharpe: 0.0
cost_stress_multiplier: 2.0

strategies:
  - name: trend_sma
    fixed: {rebalance: M, weighting: equal}
    grid: {lookback: [100, 150, 200, 250]}
  - name: xs_momentum
    fixed: {rebalance: M, skip: 21, abs_filter: true}
    grid: {lookback: [126, 252], top_k: [2, 3]}

store_dir: runs

live_trading:
  enabled: false         # DISABLED. Never enable before Stage 4 and explicit written approval.

# --------------------------------------------------------------------------------------------
# Paper trading (Stage 2): simulated money, one step per trading day. Orders decided at the close
# of day D are filled at the close of D+1 (same convention as the backtest).
paper:
  strategy: {name: trend_sma, params: {lookback: 200, rebalance: M, weighting: equal}}
  initial_cash: 10000
  cash_buffer: 0.01        # size orders on 99% of equity so a next-day price rise cannot overspend
  min_trade_value: 50
  state_file: paper/state.json
  notify_summary: true

# Discord: webhook URL comes from the DISCORD_WEBHOOK_URL environment variable (never from this file)
notify:
  discord: {enabled: true}

# News layer: ADVISORY ONLY. Cannot create orders. See docs/NEWS_AGENT.md.
news:
  lookback_hours: 24
  max_items: 40
  # Verify these URLs before relying on them (not reachable from the development sandbox).
  rss_feeds:
    - https://www.federalreserve.gov/feeds/press_all.xml
    - https://www.ecb.europa.eu/rss/press.xml
  x:                        # X (Twitter) API: paid pay-per-use access, requires X_BEARER_TOKEN
    enabled: false
    queries:
      - "(Fed OR ECB OR tariffs OR sanctions OR election) lang:en -is:retweet"
    max_results: 20
    max_posts_per_run: 40   # hard cost guard
  llm: {model: claude-sonnet-5-5, max_tokens: 1500}   # key from ANTHROPIC_API_KEY
  overlay:                  # reduce-only exposure overlay. OFF: it cannot be backtested.
    enabled: false
    max_reduction: 0.5
    min_severity: high
    ttl_hours: 24
  briefing_file: paper/latest_briefing.json
