[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Modular research, backtesting and (paper) execution framework for systematic strategies"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "pyyaml>=6", "defusedxml>=0.7"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731", "B905"]
"src/quantlab/report.py" = ["E501"]   # HTML templates
"src/quantlab/crypto_report.py" = ["E501", "B007"]   # HTML/SVG templates
"src/quantlab/daytrade_report.py" = ["E501"]   # HTML templates
